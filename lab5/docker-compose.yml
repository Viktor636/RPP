services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loyalty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loyalty}
      POSTGRES_DB: ${POSTGRES_DB:-loyalty}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-loyalty}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-loyalty}
    ports:
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - "CMD-SHELL"
        - "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672"
      interval: 10s
      timeout: 10s
      retries: 15

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loyalty}:${POSTGRES_PASSWORD:-loyalty}@postgres:5432/${POSTGRES_DB:-loyalty}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-loyalty}:${RABBITMQ_DEFAULT_PASS:-loyalty}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loyalty}:${POSTGRES_PASSWORD:-loyalty}@postgres:5432/${POSTGRES_DB:-loyalty}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-loyalty}:${RABBITMQ_DEFAULT_PASS:-loyalty}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  notifier:
    build: ./notifier
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-loyalty}:${RABBITMQ_DEFAULT_PASS:-loyalty}@rabbitmq:5672/
      MIN_DELAY_MS: "200"
      MAX_DELAY_MS: "1500"
      UNSUBSCRIBED: ""
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped

  analytics:
    build: ./analytics
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-loyalty}:${RABBITMQ_DEFAULT_PASS:-loyalty}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8002:8002"
    restart: unless-stopped

volumes:
  pg_data:
  rabbit_data:
