[tool.poetry]
name = "lab3"
version = "0.1.0"
description = "LR3 — DDD lifecycle (FastAPI)"
authors = ["Гайдабура В.В.", "Копылов В.В."]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { version = "^0.30", extras = ["standard"] }
pydantic = "^2.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]