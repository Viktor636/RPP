services:
  db:
    image: postgres:16
    container_name: pg-lab

    env_file:
      - .env

    volumes:
      - pg_data:/var/lib/postgresql/data

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: app-lab

    ports:
      - "8000:8000"

    env_file:
      - .env

    networks:
      - app-network

    depends_on:
      db:
        condition: service_healthy

networks:
  app-network:

volumes:
  pg_data: