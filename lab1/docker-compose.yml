version: '3.8'

services:
 db:
   image: postgres:16
   container_name: pg-lab
   environment:
     POSTGRES_USER: app
     POSTGRES_PASSWORD: changeme
     POSTGRES_DB: visits_db
   volumes:
     - pg_data:/var/lib/postgresql/data
   networks:
     - app-network
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U app -d visits_db"]
     interval: 10s
     timeout: 5s
     retries: 5

 app:
   build: .
   container_name: app-lab
   ports:
     - "8000:8000"
   env_file:
     - .env
   networks:
     - app-network
   depends_on:
     db:
       condition: service_healthy

networks:
 app-network:

volumes:
 pg_data: